{% extends "base.html" %}

{% block title %}Вход — Campus Connect{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <span class="icon">🏛️</span>
                <h2>Вход в Campus Connect</h2>
                <p>Добро пожаловать обратно!</p>
            </div>

            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="student@urfu.ru" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="alert" class="hidden"></div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>

            <div class="auth-footer">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>

<script>
async function login(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const alert = document.getElementById('alert');
    const button = document.querySelector('.btn-submit');

    button.disabled = true;
    button.textContent = 'Вход...';

    try {
        const response = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // Сохраняем токен в localStorage
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user_email', email);

            // ⭐ Устанавливаем куку на 7 дней
            document.cookie = `access_token=${data.access_token}; path=/; max-age=604800`;

            // Редирект в ЛК
            window.location.href = '/dashboard';
        } else {
            showAlert(alert, '❌ ' + data.detail, 'error');
            button.disabled = false;
            button.textContent = 'Войти';
        }
    } catch (error) {
        showAlert(alert, '❌ Ошибка подключения к серверу', 'error');
        button.disabled = false;
        button.textContent = 'Войти';
    }
}

function showAlert(element, message, type) {
    element.classList.remove('hidden', 'alert-error', 'alert-success');
    element.classList.add('alert', 'alert-' + type);
    element.textContent = message;
}
</script>
{% endblock %}
